<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;font-family:Arial,sans-serif}
.panel{position:absolute;inset:0;padding:5%;box-sizing:border-box;background:linear-gradient(150deg,rgba(7,11,20,.97),rgba(11,25,38,.96));border:2px solid rgba(80,232,255,.38);color:white}
.top{display:flex;justify-content:space-between}.brand{font-weight:900;letter-spacing:.14em}.live{color:#6defff;font-weight:800}
.customer{font-size:clamp(22px,5vw,58px);font-weight:900;margin-top:4%}
.small{opacity:.6}
.progress{display:grid;grid-template-columns:1fr 1fr;gap:3%;margin-top:4%}
.tile{background:rgba(255,255,255,.045);border-radius:14px;padding:6%}
.tile span{display:block;opacity:.5;font-size:clamp(11px,2vw,22px)}
.tile strong{font-size:clamp(26px,6vw,70px)}
.card{margin-top:4%;padding:4%;border:1px solid rgba(120,230,255,.28);border-radius:16px;background:rgba(255,255,255,.03)}
.name{font-size:clamp(24px,5vw,65px);font-weight:900}
.rarity{color:#76efff;font-weight:900;letter-spacing:.08em;margin-top:1%}
.details{display:grid;grid-template-columns:1fr 1fr;gap:3%;margin-top:4%}
.detail{background:rgba(255,255,255,.04);border-radius:10px;padding:4%}
.detail label{display:block;opacity:.5;font-size:clamp(10px,1.8vw,20px)}
.detail strong{font-size:clamp(16px,3vw,34px)}
.value{margin-top:5%;font-size:clamp(36px,8vw,90px);font-weight:1000}
.glow{animation:glow .7s ease-out}
@keyframes glow{0%{box-shadow:inset 0 0 0 rgba(65,255,143,0)}35%{box-shadow:inset 0 0 100px rgba(65,255,143,.3)}100%{box-shadow:inset 0 0 0 rgba(65,255,143,0)}}
</style>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/favicon-192.png">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png"></head>
<body>
<div class="panel" id="panel">
  <div class="top"><div class="brand">RAREIQ <span id="overlayVersion" style="font-size:.55em;opacity:.62">vâ€”</span></div><div class="live">â— LIVE</div></div><div id="visionStatus" style="margin-top:3%;padding:3%;border-radius:10px;background:rgba(255,255,255,.04);font-weight:900;color:#ffd36b">CAMERA OFFLINE</div>
  <div class="customer" id="customer">Demo Customer</div>
  <div class="small" id="order">RIQ-0001 â€¢ Greninja Jumbo Box</div>

  <div class="progress">
    <div class="tile"><span>BOX</span><strong id="box">1 / 1</strong></div>
    <div class="tile"><span>PACK</span><strong id="pack">1 / 5</strong></div>
    <div class="tile"><span>CARDS</span><strong id="cards">0</strong></div>
    <div class="tile"><span>HITS</span><strong id="hits">0</strong></div>
  </div>

  <div class="card">
    <div class="name" id="cardName">Waiting for cardâ€¦</div>
    <div class="rarity" id="rarity">SCANNING</div>
    <div class="details">
      <div class="detail"><label>Card Number</label><strong id="number">â€”</strong></div>
      <div class="detail"><label>Language</label><strong id="language">â€”</strong></div>
      <div class="detail"><label>Price Confidence</label><strong id="confidence">â€”</strong></div>
      <div class="detail"><label>Market Range</label><strong id="range">â€”</strong></div>
    </div>
    <div class="value" id="cardValue">$0.00</div>
  </div>

  <div class="value" style="font-size:clamp(30px,6vw,72px)">
    Batch total: <span id="total">$0.00</span>
  </div>
</div>
<script src="/static/common.js">fetch("/api/version",{cache:"no-store"})
  .then(r=>r.json())
  .then(data=>{
    const el=document.getElementById("overlayVersion");
    if(el&&data?.version?.version)el.textContent=`v${data.version.version}`;
  })
  .catch(()=>{});
</script>
<script>
const $=id=>document.getElementById(id);
function session(s){
  $("customer").textContent=s.customer;
  $("order").textContent=`${s.order_number} â€¢ ${s.product_name}`;
  $("box").textContent=`${s.active_box_number} / ${s.boxes_total}`;
  $("pack").textContent=`${s.active_pack_number} / ${s.packs_per_box}`;
  $("cards").textContent=s.card_count;
  $("hits").textContent=s.hit_count;
  $("total").textContent=money(s.total_value);
}
function card(c){
  $("cardName").textContent=c.card_name;
  $("rarity").textContent=c.rarity;
  $("number").textContent=c.card_number||"â€”";
  $("language").textContent=c.language||"â€”";
  $("confidence").textContent=c.price_confidence||"â€”";
  $("range").textContent=`${money(c.market_low)} â€“ ${money(c.market_high)}`;
  $("cardValue").textContent=money(c.raw_value);
}
function renderVision(v){
  const el=document.getElementById("visionStatus");
  if(!el)return;
  if(!v.running){
    el.textContent="CAMERA OFFLINE";
    el.style.color="#ff747c";
  }else if(v.stable){
    el.textContent="CARD LOCKED";
    el.style.color="#69ffad";
  }else if(v.visible){
    el.textContent="CARD DETECTED";
    el.style.color="#ffd36b";
  }else{
    el.textContent="SEARCHING";
    el.style.color="#ffd36b";
  }
}
connectRareIQ(message=>{
  if(message.type==="snapshot"&&message.payload?.vision)renderVision(message.payload.vision);
  if(["card_tracking","vision_status"].includes(message.type))renderVision(message.payload);

  if(message.payload?.session) session(message.payload.session);
  if(message.type==="card_reveal"){
    card(message.payload.card);
  }
  if(message.type==="pack_started"){
    $("panel").classList.remove("glow");
    void $("panel").offsetWidth;
    $("panel").classList.add("glow");
  }
});
</script>
<script>
async function syncOverlayVersion(){
  const el=document.getElementById("overlayVersion");
  try{
    const response=await fetch("/api/version?ts="+Date.now(),{cache:"no-store"});
    const data=await response.json();
    if(el)el.textContent=`v${data?.version?.version||"2.0.0"}`;
  }catch(error){
    if(el)el.textContent="v2.0.0";
  }
}
syncOverlayVersion();
</script>
</body>
</html>
