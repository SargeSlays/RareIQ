<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RareIQ Production Screen</title><link rel="stylesheet" href="/static/overlay_theme.css?v=20260830-1"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Inter,Segoe UI,sans-serif}.screen{--accent:var(--overlay-accent);position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--accent) 18%,transparent),transparent 40%),linear-gradient(145deg,var(--overlay-chrome),var(--overlay-panel));color:var(--overlay-text);opacity:0;transform:scale(1.02);transition:.45s}.screen.visible{opacity:1;transform:none}.screen:before,.screen:after{content:"";position:absolute;width:55vw;height:55vw;border:1px solid color-mix(in srgb,var(--accent) 14%,transparent);border-radius:50%;animation:drift 16s linear infinite}.screen:after{width:75vw;height:75vw;animation-direction:reverse;animation-duration:24s}.content{position:relative;z-index:2;display:grid;justify-items:center;max-width:850px;padding:40px;text-align:center}.logo{width:90px;margin-bottom:24px;filter:drop-shadow(0 0 22px color-mix(in srgb,var(--accent) 40%,transparent))}.eyebrow{color:var(--accent);font-size:13px;font-weight:900;letter-spacing:.24em;text-transform:uppercase}.screen h1{margin:12px 0 8px;font-size:clamp(42px,7vw,94px);line-height:.96}.screen p{max-width:680px;margin:0;color:var(--overlay-muted);font-size:clamp(16px,2vw,24px)}.countdown{margin-top:30px;color:var(--overlay-text);font:800 clamp(38px,6vw,78px)/1 "JetBrains Mono",monospace;letter-spacing:.08em}.bar{width:min(480px,70vw);height:3px;margin-top:22px;background:rgba(255,255,255,.12)}.bar i{display:block;width:100%;height:100%;background:var(--accent);box-shadow:0 0 16px var(--accent)}@keyframes drift{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.screen:before,.screen:after{animation:none}}</style></head><body><main class="screen" id="screen"><div class="content"><img class="logo" src="/static/brand/v1/logos/rare-iq-icon-dark.svg" alt=""><span class="eyebrow" id="eyebrow">LIVE PRODUCTION</span><h1 id="title">Starting Soon</h1><p id="message">The stream will begin shortly.</p><strong class="countdown" id="countdown"></strong><div class="bar"><i id="bar"></i></div></div></main><script src="/static/overlay_runtime.js?v=1"></script><script src="/static/overlay_production_screen.js?v=20260830-1"></script></body></html>
