<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RareIQ Broadcast Graphics</title><link rel="stylesheet" href="/static/overlay_theme.css?v=20260830-1"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Inter,Segoe UI,sans-serif}.graphic{--accent:var(--overlay-accent);position:absolute;left:4%;bottom:7%;display:grid;grid-template-columns:auto 1fr;align-items:center;min-width:420px;max-width:70%;padding:14px 20px;border:1px solid color-mix(in srgb,var(--accent) 42%,transparent);border-left:5px solid var(--accent);border-radius:var(--overlay-radius);background:var(--overlay-panel-glass);color:var(--overlay-text);box-shadow:0 18px 55px rgba(0,0,0,.42);opacity:0;transform:translateX(-110%);transition:.42s cubic-bezier(.2,.9,.2,1)}.graphic.visible{opacity:1;transform:none}.graphic[data-style="solid"]{background:var(--overlay-panel)}.graphic[data-style="neon"]{box-shadow:0 0 34px color-mix(in srgb,var(--accent) 35%,transparent)}.graphic[data-kind="card"]{grid-template-columns:100px 1fr}.graphic img{width:78px;max-height:110px;margin-right:16px;border-radius:8px;object-fit:contain}.graphic-copy{display:grid;gap:5px}.graphic strong{font-size:26px;line-height:1.05}.graphic span{color:var(--overlay-muted);font-size:15px}.graphic i{position:absolute;left:20px;bottom:-6px;width:80px;height:2px;background:var(--accent);box-shadow:0 0 10px var(--accent)}@media(max-width:700px){.graphic{min-width:0;max-width:84%;padding:11px 15px}.graphic strong{font-size:19px}.graphic span{font-size:12px}}</style></head><body><section class="graphic" id="graphic"><img id="graphicImage" alt="" hidden><div class="graphic-copy"><strong id="graphicTitle"></strong><span id="graphicSubtitle"></span></div><i></i></section><script src="/static/overlay_runtime.js?v=1"></script><script src="/static/overlay_graphics.js?v=20260830-1"></script></body></html>
