<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rare Intelligence Overlay</title>
  <style>
    :root{font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ri-text,#f4f7fa);--ri-accent:#8be8ca;--ri-secondary:#48b995;--ri-panel:rgba(24,34,46,.96);--ri-radius:4px;--ri-scale:1}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}
    body{aspect-ratio:16/9}
    .stage{position:absolute;inset:0;opacity:0;transform:translateY(28px);transition:opacity .42s ease,transform .55s cubic-bezier(.2,.8,.2,1)}
    .stage.live{opacity:1;transform:none}
    .card{position:absolute;left:4.5%;bottom:7%;width:min(44vw,840px);min-height:270px;display:grid;grid-template-columns:min(28%,220px) 1fr;gap:26px;padding:26px 30px;border-radius:var(--ri-radius);background:var(--ri-panel);border:1px solid color-mix(in srgb,var(--ri-accent) 35%,transparent);box-shadow:0 28px 78px rgba(0,0,0,.55),inset 3px 0 0 var(--ri-accent);backdrop-filter:blur(18px);transform-origin:left bottom;scale:var(--ri-scale)}
    .reaction{position:absolute;left:5.8%;bottom:calc(7% + 290px);padding:8px 14px;border-radius:6px;background:rgba(24,34,46,.94);border:1px solid color-mix(in srgb,var(--ri-accent) 35%,transparent);color:var(--ri-accent);font-size:13px;font-weight:900;letter-spacing:.14em;opacity:0;transform:translateY(12px)}
    .stage.reveal-low .reaction,.stage.reveal-medium .reaction,.stage.reveal-grail .reaction{animation:reactionIn 2.2s ease both}
    .stage.reveal-low .card{animation:lowReveal 1.1s ease both}
    .stage.reveal-medium .card{animation:mediumReveal 1.55s cubic-bezier(.2,.8,.2,1) both;border-color:color-mix(in srgb,var(--ri-secondary) 72%,transparent)}
    .stage.reveal-grail .card{animation:grailReveal 2.2s cubic-bezier(.16,.9,.2,1) both;border-color:rgba(255,211,92,.8)}
    .stage.reveal-grail:before{content:"";position:absolute;inset:-20%;background:conic-gradient(from 0deg,transparent,rgba(78,220,255,.12),transparent,rgba(255,204,77,.15),transparent);animation:grailSweep 4s linear both;pointer-events:none}
    .art{width:100%;aspect-ratio:1;object-fit:contain;align-self:center;border:1px solid color-mix(in srgb,var(--ri-accent) 22%,transparent);border-radius:8px;background:radial-gradient(circle,color-mix(in srgb,var(--ri-accent) 15%,transparent),transparent 68%)}
    .eyebrow{color:var(--ri-accent);font-size:15px;font-weight:850;letter-spacing:.16em;text-transform:uppercase}
    h1{margin:5px 0 2px;font-size:clamp(38px,4vw,70px);line-height:1;letter-spacing:-.035em}
    .genus{margin:0;color:color-mix(in srgb,var(--ri-text) 64%,transparent);font-size:19px}
    .types{display:flex;gap:8px;margin:14px 0 18px}.types span{padding:6px 12px;border-radius:5px;border:1px solid color-mix(in srgb,var(--ri-accent) 30%,transparent);background:color-mix(in srgb,var(--ri-accent) 10%,transparent);font-size:12px;font-weight:850;letter-spacing:.11em}
    .facts{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.fact{padding:10px 12px;border-radius:6px;background:color-mix(in srgb,var(--ri-accent) 6%,transparent);border:1px solid color-mix(in srgb,var(--ri-accent) 14%,transparent)}.fact span{display:block;color:color-mix(in srgb,var(--ri-text) 48%,transparent);font-size:10px;text-transform:uppercase;letter-spacing:.12em}.fact b{display:block;margin-top:3px;font-size:14px}
    .flavor{grid-column:1/-1;margin:18px 0 0;padding-top:14px;border-top:1px solid color-mix(in srgb,var(--ri-accent) 18%,transparent);color:color-mix(in srgb,var(--ri-text) 80%,transparent);font-size:16px;line-height:1.45}
    .brand{position:absolute;right:5%;bottom:8%;color:var(--ri-text);opacity:.76;font-weight:900;letter-spacing:.18em;font-size:14px}
    .stage[data-align="right"] .card{left:auto;right:4.5%;transform-origin:right bottom}.stage[data-align="center"] .card{left:50%;translate:-50% 0;transform-origin:center bottom}
    .stage.hide-art .card{grid-template-columns:1fr}.stage.hide-art .art,.stage.hide-facts .facts,.stage.hide-flavor .flavor,.stage.hide-brand .brand{display:none}
    @keyframes reactionIn{0%{opacity:0;transform:translateY(12px)}18%,72%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-5px)}}
    @keyframes lowReveal{0%{transform:translateY(20px);opacity:0}55%{transform:translateY(-3px)}100%{transform:none;opacity:1}}
    @keyframes mediumReveal{0%{transform:translateY(28px) scale(.96);opacity:0;filter:brightness(1)}45%{transform:scale(1.025);filter:brightness(1.35)}100%{transform:none;opacity:1;filter:none}}
    @keyframes grailReveal{0%{transform:translateY(34px) scale(.9);opacity:0;filter:brightness(2)}36%{transform:scale(1.05);filter:brightness(1.65)}100%{transform:none;opacity:1;filter:none;box-shadow:0 26px 90px rgba(0,0,0,.55),0 0 70px rgba(255,205,77,.23),inset 4px 0 0 #ffd45d}}
    @keyframes grailSweep{from{transform:rotate(0);opacity:0}20%,75%{opacity:1}to{transform:rotate(270deg);opacity:0}}
    @media(prefers-reduced-motion:reduce){*,*:before{animation-duration:.01ms!important;animation-iteration-count:1!important}}
    @media(max-aspect-ratio:4/3){.card{width:82vw}.brand{display:none}}
    body.preview .card{left:4%;bottom:7%;width:82%;min-height:0;grid-template-columns:112px 1fr;gap:14px;padding:14px 18px;border-radius:min(var(--ri-radius),10px)}
    body.preview .art{border-radius:6px}body.preview .eyebrow{font-size:9px}body.preview h1{margin:3px 0;font-size:28px}body.preview .genus{font-size:11px}
    body.preview .types{margin:7px 0 9px}body.preview .types span{padding:3px 7px;font-size:8px}body.preview .facts{gap:5px}body.preview .fact{padding:6px 7px}body.preview .fact span{font-size:7px}body.preview .fact b{font-size:9px}
    body.preview .flavor{margin-top:8px;padding-top:7px;font-size:9px;line-height:1.3}body.preview .brand{right:4%;bottom:3%;font-size:8px}body.preview .reaction{display:none}
  </style>
</head>
<body>
  <main class="stage" id="stage" aria-live="polite">
    <div class="reaction" id="reaction">CARD REVEALED</div>
    <section class="card">
      <img class="art" id="art" alt="Pokémon artwork">
      <div>
        <div class="eyebrow" id="number">RARE INTELLIGENCE</div>
        <h1 id="name">Pokémon</h1>
        <p class="genus" id="genus"></p>
        <div class="types" id="types"></div>
        <div class="facts">
          <div class="fact"><span>Height</span><b id="height">--</b></div>
          <div class="fact"><span>Weight</span><b id="weight">--</b></div>
          <div class="fact"><span>Abilities</span><b id="abilities">--</b></div>
        </div>
        <p class="flavor" id="flavor"></p>
      </div>
    </section>
    <div class="brand" id="brand">RAREIQ · LIVE INTELLIGENCE</div>
  </main>
  <script src="/static/overlay_runtime.js?v=1"></script>
  <script>
    const byId=id=>document.getElementById(id);
    let signature="",contentSignature="";
    const preview=new URLSearchParams(location.search).get("preview")==="1";
    document.body.classList.toggle("preview",preview);
    function rgba(hex,alpha){const value=String(hex||"#18222e").replace("#","");const n=parseInt(value,16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${alpha})`}
    function applyTheme(theme={}){
      const root=document.documentElement,stage=byId("stage");
      root.style.setProperty("--ri-accent",theme.accent_color||"#8be8ca");
      root.style.setProperty("--ri-secondary",theme.secondary_color||"#48b995");
      root.style.setProperty("--ri-text",theme.text_color||"#f4f7fa");
      root.style.setProperty("--ri-panel",rgba(theme.background_color,theme.panel_opacity??.96));
      root.style.setProperty("--ri-radius",`${theme.corner_radius??4}px`);
      root.style.setProperty("--ri-scale",String((theme.scale??100)/100));
      const fonts={inter:"Inter,Segoe UI,Arial,sans-serif",system:"system-ui,sans-serif",serif:"Georgia,serif",mono:"Consolas,monospace"};
      root.style.fontFamily=fonts[theme.font]||fonts.inter;
      stage.dataset.align=theme.alignment||"left";
      ["art","facts","flavor","brand"].forEach(key=>stage.classList.toggle(`hide-${key}`,theme[`show_${key}`]===false));
      text("brand",theme.brand_text,"RAREIQ · LIVE INTELLIGENCE");
    }
    function text(id,value,fallback="--"){byId(id).textContent=value||fallback}
    function render(payload){
      const pokemon=payload?.pokemon;
      applyTheme(payload?.theme);
      const live=(preview||payload?.on_air===true)&&Boolean(pokemon);
      byId("stage").classList.toggle("live",live);
      if(!pokemon){
        signature="";
        contentSignature="";
        byId("art").removeAttribute("src");
        byId("art").hidden=true;
        byId("types").replaceChildren();
        return;
      }
      const next=`${pokemon.id}:${pokemon.name}:${payload.identity?.card_id||""}`;
      const stage=byId("stage");
      const tier=String(payload?.reveal?.hit_tier||"standard");
      if(next!==signature){
        signature=next;
        stage.classList.remove("reveal-standard","reveal-low","reveal-medium","reveal-grail");
        void stage.offsetWidth;
        stage.classList.add(`reveal-${tier}`);
      }
      const content=JSON.stringify([pokemon,payload.reveal]);
      if(content===contentSignature) return;
      contentSignature=content;
      text("reaction",payload?.reveal?.reaction_copy,"CARD REVEALED");
      text("number",pokemon.id?`#${String(pokemon.id).padStart(4,"0")} · RARE INTELLIGENCE`:"RARE INTELLIGENCE");
      text("name",pokemon.name);
      text("genus",pokemon.genus,"Pokémon species intelligence");
      text("height",pokemon.height_m!=null?`${pokemon.height_m} m`:null);
      text("weight",pokemon.weight_kg!=null?`${pokemon.weight_kg} kg`:null);
      text("abilities",(pokemon.abilities||[]).join(" · "));
      text("flavor",pokemon.flavor_text,"");
      byId("art").src=pokemon.artwork_url||"";
      byId("art").hidden=!pokemon.artwork_url;
      byId("types").replaceChildren(...(pokemon.types||[]).map(value=>{
        const span=document.createElement("span");span.textContent=String(value).toUpperCase();return span;
      }));
    }
    RareIQOverlay.start({
      load:signal=>Promise.all([RareIQOverlay.json("/api/rare-intelligence/current",signal),RareIQOverlay.json("/api/overlay/state",signal)]),
      render:([payload,state])=>{
        payload.theme=state?.state?.rare_intelligence_theme||payload.theme;
        render(payload);
      },
      clear:()=>render({pokemon:null,on_air:false}),
    });
    window.addEventListener("message",event=>{if(event?.data?.type==="rare-intelligence-theme-preview") applyTheme(event.data.theme||{})});
  </script>
</body>
</html>
