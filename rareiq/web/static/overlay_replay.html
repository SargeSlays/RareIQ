<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RareIQ Instant Replay</title>
  <link rel="stylesheet" href="/static/overlay_theme.css?v=20260830-1">
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
    .replay{position:relative;width:100%;height:100%;opacity:0;transition:.2s}
    .replay.active{opacity:1}
    .replay img{width:100%;height:100%;object-fit:contain}
    .badge{position:absolute;left:24px;top:22px;padding:8px 13px;border:1px solid var(--overlay-border);background:var(--overlay-panel-glass);color:var(--overlay-text);font:900 12px Inter,sans-serif;letter-spacing:.15em}
    .badge:before{content:"";display:inline-block;width:8px;height:8px;margin-right:8px;border-radius:50%;background:var(--overlay-accent)}
    .progress{position:absolute;left:3%;right:3%;bottom:3%;height:3px;background:rgba(255,255,255,.18)}
    .progress i{display:block;width:0;height:100%;background:var(--overlay-accent)}
  </style>
</head>
<body>
  <main class="replay" id="replay" data-state-url="/api/production/replay">
    <img id="frame" alt="Instant replay">
    <div class="badge">INSTANT REPLAY</div>
    <div class="progress"><i id="progress"></i></div>
  </main>
  <script src="/static/overlay_runtime.js?v=20260830-1"></script>
  <script src="/static/overlay_replay.js?v=20260830-1"></script>
</body>
</html>
