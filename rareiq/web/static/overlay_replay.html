<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RareIQ Instant Replay</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}.replay{position:relative;width:100%;height:100%;opacity:0;transition:.2s}.replay.active{opacity:1}.replay img{width:100%;height:100%;object-fit:cover}.badge{position:absolute;left:24px;top:22px;padding:8px 13px;border-radius:9px;background:rgba(6,18,27,.88);color:#fff;font:900 12px Inter,sans-serif;letter-spacing:.15em}.badge:before{content:"";display:inline-block;width:8px;height:8px;margin-right:8px;border-radius:50%;background:#ff5963;box-shadow:0 0 10px #ff5963}.progress{position:absolute;left:3%;right:3%;bottom:3%;height:3px;background:rgba(255,255,255,.18)}.progress i{display:block;width:0;height:100%;background:linear-gradient(90deg,#55dff8,#9d72ff)}</style></head><body><main class="replay" id="replay"><img id="frame" alt="Instant replay"><div class="badge">INSTANT REPLAY</div><div class="progress"><i id="progress"></i></div></main><script>const replay=document.getElementById("replay"),frame=document.getElementById("frame"),progress=document.getElementById("progress");let generation=-1,timer=0;async function sync(){try{const state=await fetch("/api/production/replay",{cache:"no-store"}).then(r=>r.json()),play=state.playback||{};if(play.generation!==generation){generation=play.generation;clearInterval(timer);replay.classList.toggle("active",play.active===true);if(play.active){const item=(state.highlights||[]).find(v=>v.id===play.highlight_id);if(item){let index=0,interval=1000/(item.fps*(play.speed||1));const draw=()=>{frame.src=`/api/production/replay/${item.id}/frame/${index}?g=${generation}`;progress.style.width=`${Math.min(100,index/item.frames*100)}%`;index++;if(index>=item.frames){clearInterval(timer);setTimeout(()=>replay.classList.remove("active"),300)}};draw();timer=setInterval(draw,interval);}}}}catch{}setTimeout(sync,250)}sync();</script></body></html>
