<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,sans-serif}
.widget{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:white;background:rgba(6,11,18,.88);border:2px solid rgba(100,234,255,.45);
  border-radius:22px;box-sizing:border-box;
}
.inner{text-align:center}
.label{font-size:clamp(12px,4vw,28px);opacity:.55;letter-spacing:.16em;font-weight:800}
.count{font-size:clamp(40px,15vw,110px);font-weight:1000;line-height:1}
.meta{font-size:clamp(12px,3vw,24px);opacity:.72;margin-top:6px}
.flash{animation:nextPack 1.15s ease-out}
@keyframes nextPack{
  0%{box-shadow:inset 0 0 0 rgba(65,255,143,0),0 0 0 rgba(65,255,143,0);border-color:rgba(65,255,143,.2)}
  20%{box-shadow:inset 0 0 70px rgba(65,255,143,.55),0 0 45px rgba(65,255,143,.8);border-color:rgba(65,255,143,1);transform:scale(1.03)}
  100%{box-shadow:inset 0 0 0 rgba(65,255,143,0),0 0 0 rgba(65,255,143,0);border-color:rgba(100,234,255,.45);transform:scale(1)}
}
</style>
</head>
<body>
<div class="widget" id="widget">
  <div class="inner">
    <div class="label">CURRENT PACK</div>
    <div class="count" id="count">1 / 5</div>
    <div class="meta" id="meta">Box 1 of 1</div>
  </div>
</div>
<script src="/static/common.js"></script>
<script>
const widget=document.getElementById("widget");
function render(s){
  document.getElementById("count").textContent=`${s.active_pack_number} / ${s.packs_per_box}`;
  document.getElementById("meta").textContent=`Box ${s.active_box_number} of ${s.boxes_total}`;
}
connectRareIQ(message=>{
  const s=message.payload?.session;
  if(s) render(s);
  if(message.type==="pack_started"){
    widget.classList.remove("flash");
    void widget.offsetWidth;
    widget.classList.add("flash");
  }
});
</script>
</body>
</html>
