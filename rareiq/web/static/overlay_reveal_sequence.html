<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RareIQ Rare Reveal</title><style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;font-family:Inter,Segoe UI,sans-serif;color:#fff}.stage{--duration:3200ms;--intensity:.75;position:absolute;inset:0;display:grid;place-items:center;opacity:0;isolation:isolate}.stage.live{opacity:1}.backdrop,.flash,.shockwave,.particles,.custom-visual{position:absolute;inset:0;pointer-events:none}.backdrop{background:radial-gradient(circle,rgba(31,166,215,calc(var(--intensity)*.25)),transparent 57%)}.flash{z-index:8;background:#fff;opacity:0}.shockwave{z-index:3;inset:50%;border:5px solid #70e8ff;border-radius:50%;opacity:0}.particles{z-index:4;overflow:hidden}.particle{position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;background:#72e9ff;box-shadow:0 0 14px currentColor;opacity:0;transform:rotate(var(--angle)) translateX(0)}.custom-visual{z-index:5;width:100%;height:100%;object-fit:contain;opacity:0}.card-art{position:absolute;z-index:6;left:21%;top:50%;width:min(24vw,380px);max-height:72vh;object-fit:contain;border-radius:18px;opacity:0;filter:drop-shadow(0 24px 40px rgba(0,0,0,.65))}.panel{position:relative;z-index:6;width:min(78vw,1200px);padding:28px 34px;border-radius:28px;background:linear-gradient(135deg,rgba(4,16,28,.94),rgba(9,36,49,.92));border:1px solid rgba(83,216,244,.38);box-shadow:0 30px 90px rgba(0,0,0,.5)}.panel.with-art{width:min(54vw,820px);transform:translateX(15vw)}.top{display:flex;justify-content:space-between;gap:20px;align-items:end}.eyebrow{color:#60ddf7;font-weight:900;letter-spacing:.17em;font-size:13px}h1{margin:7px 0;font-size:clamp(34px,5vw,76px);line-height:.95}.meta{color:#9eb7c5}.meter{height:12px;margin:24px 0 18px;border-radius:99px;background:#102837;overflow:hidden}.meter i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#41caff,#765cff,#ffb94e);transition:width .6s}.slots{display:flex;gap:9px}.slot{flex:1;height:9px;border-radius:99px;background:#173143}.slot.done{background:#53dbb3}.reaction{font-size:clamp(28px,4vw,64px);font-weight:1000;text-align:center;color:#ffd86a;opacity:0}.stage.animate.preset-low .panel{animation:rareReveal var(--duration) ease both}.stage.animate.preset-low .panel:after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(110deg,transparent 25%,rgba(255,255,255,.3) 44%,rgba(90,221,255,.42) 50%,transparent 66%);transform:translateX(-140%);animation:shimmer var(--duration) ease both}.stage.animate.preset-medium .panel{animation:mediumReveal var(--duration) cubic-bezier(.12,.85,.2,1) both}.stage.animate.preset-medium .shockwave,.stage.animate.preset-grail .shockwave{animation:shock var(--duration) ease-out both}.stage.animate.preset-grail .panel{border-color:#ffe27b;animation:grailReveal var(--duration) cubic-bezier(.15,.8,.18,1) both}.stage.animate.preset-grail .backdrop{animation:grailBackdrop var(--duration) ease both}.stage.animate.has-flash .flash{animation:flash var(--duration) ease-out both}.stage.animate.has-particles .particle{animation:particle var(--duration) ease-out both}.stage.animate :is(.reaction,.custom-visual.live,.card-art.live){animation:reaction var(--duration) ease both}@keyframes rareReveal{0%{opacity:0;transform:scale(.92) translateY(20px)}18%,80%{opacity:1}100%{opacity:0;transform:scale(1.03)}}@keyframes shimmer{18%{transform:translateX(-140%)}68%{transform:translateX(140%)}}@keyframes mediumReveal{0%,8%{opacity:0;transform:scale(.72)}24%{opacity:1;transform:scale(1.06)}35%,78%{opacity:1}100%{opacity:0;transform:scale(1.1)}}@keyframes grailReveal{0%,18%{opacity:0;filter:brightness(0)}31%{opacity:1;filter:brightness(1.8)}43%,82%{opacity:1;filter:brightness(1)}100%{opacity:0}}@keyframes grailBackdrop{0%,15%{background:#000;opacity:.95}30%{background:radial-gradient(circle,#fff7bd,rgba(25,180,226,.35) 28%,transparent 68%);opacity:1}100%{opacity:0}}@keyframes shock{0%,22%{inset:50%;opacity:0}28%{opacity:calc(.45 + var(--intensity)*.45)}70%,100%{inset:-18%;opacity:0}}@keyframes flash{0%,22%,31%,100%{opacity:0}25%{opacity:calc(var(--intensity)*.75)}}@keyframes particle{0%,24%{opacity:0;transform:rotate(var(--angle)) translateX(0) scale(.2)}31%{opacity:1}86%,100%{opacity:0;transform:rotate(var(--angle)) translateX(calc(35vw + var(--distance))) scale(1.4)}}@keyframes reaction{0%,22%{opacity:0;transform:scale(.65)}34%,76%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.12)}}@media(max-aspect-ratio:4/3){.card-art{left:18%;width:28vw}.panel.with-art{transform:translateX(16vw)}}@media(prefers-reduced-motion:reduce){.stage.animate :is(.panel,.reaction,.custom-visual.live,.card-art.live){animation:rareReveal var(--duration) ease both!important}.flash,.shockwave,.particles{display:none!important}}
</style></head><body><main class="stage" id="stage"><div class="backdrop"></div><div class="flash"></div><div class="shockwave"></div><div class="particles" id="particles"></div><img class="custom-visual" id="customVisual" alt=""><img class="card-art" id="revealCardArt" alt="Verified card artwork"><audio id="customAudio" preload="auto"></audio><section class="panel" id="panel"><div class="top"><div><div class="eyebrow" id="eyebrow">PACK SUSPENSE</div><h1 id="title">Building the reveal...</h1><div class="meta" id="meta">Card 0 of 6</div></div><div class="eyebrow" id="percent">0%</div></div><div class="meter"><i id="meter"></i></div><div class="slots" id="slots"></div><div class="reaction" id="reaction"></div></section></main><script>
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),previewTier=params.get("preview");let revision=-1;
function makeParticles(){$("particles").replaceChildren(...Array.from({length:38},(_,i)=>{const p=document.createElement("i");p.className="particle";p.style.setProperty("--angle",`${i*9.47}deg`);p.style.setProperty("--distance",`${(i%7)*8}px`);p.style.color=i%3===0?"#ffe478":"#72e9ff";return p}))}makeParticles();
function render(s){const stage=$("stage");stage.classList.toggle("live",s.enabled===true);if(s.revision===revision)return;revision=s.revision;const a=s.animation||{};stage.style.setProperty("--duration",`${Number(a.duration_ms||3200)}ms`);stage.style.setProperty("--intensity",String(Number(a.intensity??75)/100));const mapped=s.reaction_assets||{},visual=mapped.visual?.url||"",audio=mapped.audio?.url||"",art=s.current_card?.reference_image_url||"";$("customVisual").src=visual;$("customVisual").classList.toggle("live",Boolean(visual));$("revealCardArt").src=art;$("revealCardArt").classList.toggle("live",Boolean(art));$("panel").classList.toggle("with-art",Boolean(art));$("customAudio").src=audio;if(a.active&&s.audio_enabled===true&&audio){$("customAudio").currentTime=0;$("customAudio").play().catch(()=>{})}else $("customAudio").pause();stage.className=`stage live ${s.phase==="reaction"?"reaction":""} ${a.active?`animate preset-${a.preset}`:""} ${a.flash?"has-flash":""} ${a.particles?"has-particles":""}`;$("eyebrow").textContent=`PACK ${s.pack_number} · ${s.phase==="reaction"?"HIT REVEAL":"SUSPENSE BUILD"}`;$("title").textContent=s.phase==="reaction"?(s.current_card?.card_name||"Rare revealed!"):"Building the reveal...";$("meta").textContent=`Card ${s.position} of ${s.expected_cards} · rare slot ${s.rare_slot}`;$("percent").textContent=`${s.suspense_percent}%`;$("meter").style.width=`${s.suspense_percent}%`;$("reaction").textContent=s.reaction_copy||"";$("slots").replaceChildren(...Array.from({length:s.expected_cards},(_,i)=>{const e=document.createElement("i");e.className=`slot ${i<s.position?"done":""}`;return e}))}
function previewState(tier){const labels={low:["Rare pull!","Nice pull!"],medium:["Big hit!","YES! BIG HIT!"],grail:["Grail hit!","OH MY GOD — GRAIL HIT!"]},choice=labels[tier]||labels.low;return{enabled:true,revision:Date.now(),phase:"reaction",pack_number:"PREVIEW",position:6,expected_cards:6,rare_slot:6,suspense_percent:100,current_card:{card_name:choice[0]},reaction_copy:choice[1],audio_enabled:false,reaction_assets:{},animation:{active:true,preset:tier,intensity:Math.max(0,Math.min(100,Number(params.get("intensity")||75))),duration_ms:Math.max(800,Number(params.get("duration")||3200)),particles:params.get("particles")!=="false",flash:params.get("flash")!=="false"}}}
async function tick(){try{const r=await fetch("/api/creator/reveal-sequence",{cache:"no-store"});render((await r.json()).state||{})}catch{}}
if(["low","medium","grail"].includes(previewTier)){render(previewState(previewTier))}else{tick();setInterval(tick,350)}
</script></body></html>
