<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RareIQ Program Output</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}.program{position:relative;width:100%;height:100%;background:#000}.program img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity var(--duration,0ms) ease,transform var(--duration,0ms) ease}.program img.out{opacity:0}.program[data-transition="slide"] img.incoming{transform:translateX(0)}.program[data-transition="slide"] img.out{transform:translateX(-12%)}.program[data-transition="zoom"] img.incoming{transform:scale(1)}.program[data-transition="zoom"] img.out{transform:scale(1.08)}.program-bug{position:absolute;right:20px;bottom:18px;width:34px;opacity:.5}</style></head><body><main class="program" id="program"><img id="programA" alt=""><img id="programB" class="out" alt=""><img class="program-bug" src="/static/brand/rareiq_icon_transparent.png" alt=""></main><script>const stage=document.getElementById("program"),frames=[document.getElementById("programA"),document.getElementById("programB")];let active=0,generation=-1;async function sync(){try{const state=await fetch("/api/production/switcher",{cache:"no-store"}).then(r=>r.json());if(state.generation!==generation){generation=state.generation;const incoming=frames[1-active],outgoing=frames[active];stage.dataset.transition=state.transition;stage.style.setProperty("--duration",`${state.duration_ms||0}ms`);incoming.src=`/api/camera-slots/${state.program_slot}/stream?g=${generation}`;incoming.className="incoming";outgoing.className="out";setTimeout(()=>{active=1-active},state.duration_ms||0);}}catch{}setTimeout(sync,300)}sync();</script></body></html>
