<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>RareIQ vX.1 Diagnostics</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#070b12;color:#fff;font-family:Arial,sans-serif}
main{max-width:900px;margin:40px auto;padding:24px}
.panel{background:#101725;border:1px solid #273853;border-radius:18px;padding:24px}
h1{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:#080d16;border:1px solid #33445f;border-radius:12px;padding:14px}
.label{display:block;font-size:11px;opacity:.55;font-weight:800;letter-spacing:.08em}
.value{display:block;margin-top:5px;font-size:19px;font-weight:900;word-break:break-word}
a{color:#72eaff}
pre{background:#05080d;border-radius:12px;padding:14px;overflow:auto}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/favicon-192.png">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png"></head>
<body>
<main>
<div class="panel">
<h1>RareIQ Build Diagnostics</h1>
<p><a href="/control">â† Back to Operator Dashboard</a></p>
<div class="grid">
<div class="card"><span class="label">VERSION</span><span class="value">X.1</span></div>
<div class="card"><span class="label">CODENAME</span><span class="value">Professional Operator Console</span></div>
<div class="card"><span class="label">BUILD DATE</span><span class="value">2026.07.11</span></div>
<div class="card"><span class="label">PROJECT</span><span class="value">Project Digital Jazz</span></div>
<div class="card"><span class="label">OCR ENGINE</span><span class="value">RapidOCR</span></div>
<div class="card"><span class="label">CATALOG</span><span class="value">TCGdex</span></div>
<div class="card"><span class="label">CAMERA</span><span id="camera" class="value">Loadingâ€¦</span></div>
<div class="card"><span class="label">SERVER</span><span class="value">12X.1.1:8765</span></div>
</div>
<h2>Live version payload</h2>
<pre id="payload">Loadingâ€¦</pre>
</div>
</main>
<script>
fetch("/api/version",{cache:"no-store"})
  .then(r=>r.json())
  .then(data=>{
    document.getElementById("payload").textContent=JSON.stringify(data,null,2);
    document.getElementById("camera").textContent=data.version.camera||"Not started";
  })
  .catch(error=>{
    document.getElementById("payload").textContent=String(error);
    document.getElementById("camera").textContent="Unavailable";
  });
</script>
</body>
</html>
